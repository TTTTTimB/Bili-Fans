[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-fans"
version = "0.1.0"
description = "统计 B 站账号每日新增粉丝 / 掉粉 / 净增的小工具（纯标准库，无第三方依赖）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bilifans = "bili_fans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
